name: CI Simulation ISAC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-simulations:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installe Python (sans cache pour éviter l'erreur immédiate)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Installe toutes les dépendances requises par tes TPs
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy networkx matplotlib ipython jupyter nbconvert ipykernel

      # 4. Exécute les notebooks dans le dossier ISAC/ISAC
      - name: Run TP Notebooks
        working-directory: ISAC/ISAC
        env:
          MPLBACKEND: Agg   # Empêche matplotlib de planter sur un serveur sans écran
        run: |
          echo "Test du TP1..."
          jupyter nbconvert --to notebook --execute TP1_corrige.ipynb --output test_tp1.ipynb
          
          echo "Test du TP2..."
          jupyter nbconvert --to notebook --execute TP2_corrige.ipynb --output test_tp2.ipynb
          
          echo "Test du TP3..."
          jupyter nbconvert --to notebook --execute TP3_corrige.ipynb --output test_tp3.ipynb
