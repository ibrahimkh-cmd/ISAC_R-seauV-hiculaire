name: CI Simulation ISAC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-simulations:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère tes fichiers (comme dans ton template)
      - uses: actions/checkout@v4

      # 2. Installe Python sur le serveur GitHub
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Installe les bibliothèques indispensables à tes TPs
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy networkx matplotlib ipython jupyter nbconvert

      # 4. Exécute tes notebooks pour vérifier qu'aucune cellule ne plante
      - name: Run TP Notebooks
        run: |
          # Exécute le TP1 de A à Z en mode non-interactif
          jupyter nbconvert --to notebook --execute TP1_corrige.ipynb --output test_output_tp1.ipynb
          jupyter nbconvert --to notebook --execute TP2_corrige.ipynb --output test_output_tp2.ipynb
          jupyter nbconvert --to notebook --execute TP3_corrige.ipynb --output test_output_tp3.ipynb
